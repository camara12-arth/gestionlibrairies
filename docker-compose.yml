services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: librairie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-librairie_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-librairie_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - librairie-net

  # Application Web Next.js (Image de production optimisée)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: librairie-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-librairie_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - librairie-net

  # Interface web d'administration de la base PostgreSQL (Adminer)
  adminer:
    image: adminer:latest
    container_name: librairie-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - librairie-net

volumes:
  postgres_data:
    name: librairie_postgres_data

networks:
  librairie-net:
    name: librairie-net
    driver: bridge
