# Docker Compose override for local development with hot reload
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: librairie-app-dev
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-librairie_db}?schema=public
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: pnpm dev
